paths:
  /api/v1/organizations/{organization}/compliance-types:
    parameters: [{$ref: '#/components/parameters/Organization'}]
    get:
      summary: List compliance types
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      summary: Create an organization compliance type
      description: Requires compliance.write. Vehicle calendar reminders have one warning stage and one overdue stage, with transactional in-app and HTML email intents. Each type (road tax, insurance, PUSPAKOM) defaults to 30 warning days. This registry does not determine legal eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, subject_type]
              properties:
                code: {type: string, pattern: '^[A-Za-z0-9_-]{1,80}$'}
                name: {type: string, maxLength: 160}
                subject_type: {type: string, enum: [vehicle, driver]}
                warning_days: {type: integer, minimum: 0, maximum: 3650, default: 30}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance-types/{type}:
    parameters:
      - {$ref: '#/components/parameters/Organization'}
      - {name: type, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: Update compliance reminder configuration
      description: Requires compliance.write and the current version. Adjust warning days, name or active status per type. Subject and code cannot change. Prior open reminders are superseded; the evaluator uses the new version on its next run. Does not change verified evidence or legal coverage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                name: {type: string, maxLength: 160}
                warning_days: {type: integer, minimum: 0, maximum: 3650, default: 30}
                active: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance-obligations:
    parameters: [{$ref: '#/components/parameters/Organization'}]
    get:
      summary: List compliance obligations
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      summary: Create a vehicle or driver obligation
      description: Requires compliance.write. Subject and type must belong to the same tenant and agree on subject type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compliance_type_id, subject_type, subject_id]
              properties:
                compliance_type_id: {type: string, format: uuid}
                subject_type: {type: string, enum: [vehicle, driver]}
                subject_id: {type: string, format: uuid}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance-obligations/{obligation}:
    parameters:
      - {$ref: '#/components/parameters/Organization'}
      - {$ref: '#/components/parameters/ComplianceObligation'}
    get:
      summary: Retrieve an obligation and its current local-calendar status
      description: The latest eligible verified coverage is used; a future-dated record is not active before its start, and genuine gaps remain expired. No file download or evidence verification is performed by this endpoint.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance/status:
    parameters: [{$ref: '#/components/parameters/Organization'}]
    get:
      summary: List compliance status for up to 100 obligations
      description: States include unknown, valid, due_soon, expired, suspended and not_applicable. Current verified coverage requires an authorized manual verification and evidence reference; automated document verification is not implemented.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance-obligations/{obligation}/renewals:
    parameters:
      - {$ref: '#/components/parameters/Organization'}
      - {$ref: '#/components/parameters/ComplianceObligation'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 8, maxLength: 255}
    post:
      summary: Record a pending renewal cycle
      description: A renewal does not change coverage until separately verified. Changed input under one idempotency key conflicts. Vehicle reminders queue in-app and HTML email intents; automatic document verification and driver-obligation reminders remain unimplemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valid_from, expires_on]
              properties:
                reference_number: {type: string, maxLength: 160, nullable: true}
                issuing_authority: {type: string, maxLength: 160, nullable: true}
                issued_on: {type: string, format: date, nullable: true}
                valid_from: {type: string, format: date}
                expires_on: {type: string, format: date}
                evidence_reference: {type: string, maxLength: 255, nullable: true, description: Manually managed reference to reviewed evidence; this is not a file upload.}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance-records/{record}/verify:
    parameters:
      - {$ref: '#/components/parameters/Organization'}
      - {$ref: '#/components/parameters/ComplianceRecord'}
    post:
      summary: Verify a renewal after reviewing evidence
      description: Requires compliance.verify and a non-empty evidence_reference on the pending record. The system does not validate the referenced document.
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance-records/{record}/suspend:
    parameters:
      - {$ref: '#/components/parameters/Organization'}
      - {$ref: '#/components/parameters/ComplianceRecord'}
    post:
      summary: Suspend a verified compliance record immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/compliance-records/{record}/history:
    parameters:
      - {$ref: '#/components/parameters/Organization'}
      - {$ref: '#/components/parameters/ComplianceRecord'}
    get:
      summary: List renewal cycles and action events for an obligation
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  parameters:
    ComplianceObligation:
      name: obligation
      in: path
      required: true
      schema: {type: string, format: uuid}
    ComplianceRecord:
      name: record
      in: path
      required: true
      schema: {type: string, format: uuid}
