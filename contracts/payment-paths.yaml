paths:
  /api/v1/organizations/{organization}/payments:
    post:
      summary: Request a card payment link
      description: Requires payments.manage in the authenticated tenant. Returns the validated gateway payment URL; requesting a link does not confirm payment. Provider links are permanent; local expiry does not disable checkout, and late charges require manual reconciliation. A timeout may mean the upstream operation completed, so reconcile before retrying.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Organization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payee_name, transaction_details, amount]
              properties:
                payee_name:
                  type: string
                  maxLength: 200
                transaction_details:
                  type: string
                  maxLength: 500
                amount:
                  type: string
                  pattern: '^(?:0|[1-9][0-9]{0,9})(?:\.[0-9]{1,2})?$'
                  example: '10.00'
      responses:
        '202':
          description: Gateway returned a valid JSON response with a payment URL. Payment remains unconfirmed unless the callback was received before this response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [payment_id, status, expires_at, payment_url, gateway_id]
                        properties:
                          payment_id: {type: string, format: uuid}
                          status: {type: string, enum: [pending, succeeded, failed]}
                          expires_at: {type: string, format: date-time}
                          payment_url: {type: string, format: uri, nullable: true, description: Validated checkout URL while the attempt is pending and not expired.}
                          gateway_id: {type: string, description: Transaction reference returned by the gateway.}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/organizations/{organization}/payments/{payment}:
    get:
      summary: Retrieve a payment attempt
      description: Requires payments.manage. Failed with reason unconfirmed_timeout means no valid callback was recorded within the local confirmation window, not that the gateway has proven a failure. Ordinary attempts expire after 30 minutes; initial self-service signup checkout expires at the fixed 12-hour signup deadline. Expired signup tenant reads return 410; use organization-signups for lifecycle reconciliation.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Organization'
        - name: payment
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Payment attempt.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment:
                            type: object
                            properties:
                              id: {type: string, format: uuid}
                              amount: {type: string}
                              status: {type: string, enum: [creating, pending, creation_unknown, succeeded, failed]}
                              payment_url: {type: string, format: uri, nullable: true}
                              gateway_id: {type: string, nullable: true}
                              gateway_currency: {type: string, nullable: true}
                              failure_reason: {type: string, nullable: true}
                              expires_at: {type: string, format: date-time}
                              callback_received_at: {type: string, format: date-time, nullable: true}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/payment-gateway/callback/{payment}/{callbackToken}:
    post:
      security: []
      summary: Confirm payment with a one-time callback secret
      description: A POST with the unique per-attempt callback secret and expected User-Agent confirms payment once before its local deadline (30 minutes normally; the fixed 12-hour deadline for initial self-service signup invoices). Missing or unparseable bodies remain acceptable. If a supplied transaction response can be parsed, provided status, ID, amount and currency are checked for mismatches. The secret is a bearer credential; anyone who has it and supplies the header can claim success. Never expose or log the callback URL. At or after a signup deadline, matching authenticated callbacks are retained for manual reconciliation and return 410 without settlement; after permanent deletion the independent financial archive receives the evidence. Duplicate archived callbacks return 409; bad secrets and mismatches remain 403/422. No callback resurrects a deleted organization.
      parameters:
        - name: payment
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: callbackToken
          in: path
          required: true
          description: One-time bearer secret generated per payment attempt; never disclose or log.
          schema: {type: string}
        - name: User-Agent
          in: header
          required: true
          description: Must contain Payment Gateway by Sam Sam. This header is not proof of origin.
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                response:
                  type: string
                  description: JSON-encoded transaction object, when supplied by the gateway.
                  example: '{"transaction_id":"simulation-transaction-001","transaction_amount":10,"transaction_currency":"MYR","transaction_status":"Success"}'
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: string
                  description: JSON-encoded transaction object, when supplied by the gateway.
          '*/*':
            schema:
              description: Optional body. A response field may contain a JSON-encoded transaction object; the provider does not guarantee a Content-Type or body format.
      responses:
        '200':
          description: Callback consumed once and payment marked succeeded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
