listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/carlink/tls/ca.pem
ssl_options.certfile = /etc/carlink/tls/server.pem
ssl_options.keyfile = /etc/carlink/tls/server-key.pem
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
mqtt.listeners.tcp = none
mqtt.listeners.ssl = none
mqtt.allow_anonymous = false
mqtt.vhost = carlink
mqtt.exchange = amq.topic
mqtt.max_session_expiry_interval_seconds = 604800
web_mqtt.tcp.port = 15675
management.tcp.port = 15672
vm_memory_high_watermark.relative = 0.5
disk_free_limit.absolute = 2GB
